name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/user/**", "docs/technical/**", "docs/mkdocs.*.yml", "docs/requirements.txt", "docs/Dockerfile.user", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/user/**", "docs/technical/**", "docs/mkdocs.*.yml", "docs/requirements.txt", "docs/Dockerfile.user", ".github/workflows/docs.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict -f docs/mkdocs.user.yml
      - run: mkdocs build --strict -f docs/mkdocs.technical.yml
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  user-docs-image:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docs/Dockerfile.user
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sauerkraut-user-docs:latest
